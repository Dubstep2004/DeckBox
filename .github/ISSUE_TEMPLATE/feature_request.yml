name: Предложение
description: Идея виджета, интеграции или изменения
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что вы хотите сделать?
      description: Опишите ситуацию и что сейчас неудобно — это важнее готового решения.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Как DeckBox мог бы помочь?
  - type: textarea
    id: data
    attributes:
      label: Данные и конфиденциальность
      description: Понадобится ли для этого онлайн-сервис, аккаунт или доступ к чему-то на компьютере?
  - type: checkboxes
    id: contribute
    attributes:
      label: Участие
      options:
        - label: Хочу сделать это сам (прочитайте CONTRIBUTING.md и дождитесь одобрения для больших функций)
