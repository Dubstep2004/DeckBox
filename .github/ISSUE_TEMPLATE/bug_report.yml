name: Сообщение об ошибке
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что произошло и чего вы ожидали?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: Версия DeckBox
      description: Страница настроек показывает её рядом с заголовком (агент и приложение на телефоне должны совпадать).
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Компьютер
      placeholder: "Windows 11 24H2 / Ubuntu 24.04 / macOS 15 (Apple silicon)"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Телефон и версия Android
      placeholder: "Pixel 4a, Android 13"
  - type: dropdown
    id: connection
    attributes:
      label: Подключение
      options: [USB, Wi-Fi, Tailscale, Ещё не подключён]
  - type: textarea
    id: log
    attributes:
      label: Журнал агента
      description: >-
        Конец agent.log: %LOCALAPPDATA%\DeckBox (Windows), ~/.local/share/DeckBox (Linux),
        ~/Library/Application Support/DeckBox (macOS). Сначала уберите личное (ключи, токены, адреса календарей,
        названия ваших файлов и сессий).
      render: text
