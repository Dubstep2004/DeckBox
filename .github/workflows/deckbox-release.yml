name: DeckBox release

# Builds DeckBox-Setup-<version>.exe and DeckBox-<version>.apk and attaches them to the GitHub release
# v<version> (created if missing; files with the same name are replaced).
#
# Runs when a v* tag is pushed, or by hand: Actions › DeckBox release › Run workflow.
# The version comes from <Version> in agent/PhoneBox.Agent/PhoneBox.Agent.csproj.
#
# Repository secrets (Settings › Secrets and variables › Actions), so every APK has the same signature:
#   DECKBOX_KEYSTORE_BASE64   base64 of deckbox-release.jks
#   DECKBOX_KEYSTORE_PASSWORD the keystore password (the key password is the same; alias "deckbox")
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deckbox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK and NSIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DECKBOX_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.DECKBOX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the DECKBOX_KEYSTORE_BASE64 and DECKBOX_KEYSTORE_PASSWORD secrets (see the top of this file)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/deckbox.jks"
          {
            echo "PHONEBOX_STORE_FILE=$RUNNER_TEMP/deckbox.jks"
            echo "PHONEBOX_STORE_PASSWORD=$PASSWORD"
            echo "PHONEBOX_KEY_ALIAS=deckbox"
            echo "PHONEBOX_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: v
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version $v in PhoneBox.Agent.csproj"
            exit 1
          fi

      - name: Build the installer
        run: WORK="$RUNNER_TEMP/deckbox" bash installer/build.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/deckbox.jks"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          tag="v$V"
          files=("installer/DeckBox-Setup-$V.exe" "installer/DeckBox-$V.apk")
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "DeckBox $V" \
              --notes "Скачайте DeckBox-Setup-$V.exe и запустите. DeckBox-$V.apk — приложение для телефона отдельно."
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
