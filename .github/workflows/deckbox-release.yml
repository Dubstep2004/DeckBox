name: DeckBox release

# Builds the release files (installer, phone app, agent package for the built-in updater, checksums) and attaches
# them to the GitHub release v<version> (created if missing; files with the same name are replaced). The agents
# installed by DeckBox check this repository's latest release and update themselves and the phone app from it.
#
# Runs when a v* tag is pushed, or by hand: Actions › DeckBox release › Run workflow.
# The version comes from <Version> in agent/DeckBox.Agent/DeckBox.Agent.csproj.
#
# Repository secrets (Settings › Secrets and variables › Actions), so every APK has the same signature:
#   DECKBOX_KEYSTORE_BASE64   base64 of deckbox-release.jks
#   DECKBOX_KEYSTORE_PASSWORD the keystore password (the key password is the same; alias "deckbox")
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deckbox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK and NSIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DECKBOX_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.DECKBOX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the DECKBOX_KEYSTORE_BASE64 and DECKBOX_KEYSTORE_PASSWORD secrets (see the top of this file)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/deckbox.jks"
          {
            echo "DECKBOX_STORE_FILE=$RUNNER_TEMP/deckbox.jks"
            echo "DECKBOX_STORE_PASSWORD=$PASSWORD"
            echo "DECKBOX_KEY_ALIAS=deckbox"
            echo "DECKBOX_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: v
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/DeckBox.Agent/DeckBox.Agent.csproj | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version $v in DeckBox.Agent.csproj"
            exit 1
          fi

      - name: Build the installer
        run: WORK="$RUNNER_TEMP/deckbox" bash installer/build.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/deckbox.jks"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          tag="v$V"
          files=("installer/DeckBox-Setup-$V.exe" "installer/DeckBox-$V.apk" "installer/DeckBoxAgent-$V-win-x64.zip" "installer/SHA256SUMS-$V.txt")
          # the description comes from this version's section of CHANGELOG.md (✨ Новое, ⚡ Улучшено, 🛠 Исправлено, 🗑 Удалено)
          python3 tools/release-notes.py "$V" > "$RUNNER_TEMP/notes.md"
          title="DeckBox PRO $V$(sed -n "s/^## $V — \(.*\)$/ — \1/p" CHANGELOG.md | head -n1)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "$title" --latest --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
